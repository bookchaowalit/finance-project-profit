[project]
name = "project-profit-api"
version = "0.1.0"
description = "Project Profit Tracker API (FastAPI, SQLAlchemy 2, PostgreSQL)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pyjwt[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  # Error reporting (app/observability.py); inert unless SENTRY_DSN is set.
  "sentry-sdk>=2.20,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver.*", "alembic.*"]
ignore_missing_imports = true
